name: Release
# Tag-driven CD:
#   git tag v1.7.0-STUDIO && git push origin v1.7.0-STUDIO   -> Spindle Standard (APK + AAB)
#   git tag v1.1.1-LITE   && git push origin v1.1.1-LITE     -> Spindle Lite (APK)
# Requires repository secrets: SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD,
# SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD. Never falls back to the debug key.
on:
  push:
    tags:
      - 'v*-STUDIO'
      - 'v*-LITE'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve edition and verify version
        run: |
          VERSION="${TAG#v}"
          if [[ "$TAG" == *-STUDIO ]]; then
            echo "MODULE=app-main"   >> "$GITHUB_ENV"; echo "EDITION=Standard" >> "$GITHUB_ENV"
          else
            echo "MODULE=app-lite"   >> "$GITHUB_ENV"; echo "EDITION=Lite"     >> "$GITHUB_ENV"
          fi
          MOD=$([[ "$TAG" == *-STUDIO ]] && echo app-main || echo app-lite)
          GRADLE_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$MOD/build.gradle.kts")
          if [ "$GRADLE_VERSION" != "$VERSION" ]; then
            echo "Tag $TAG does not match $MOD versionName $GRADLE_VERSION"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Require signing secrets
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SP: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KA: ${{ secrets.SIGNING_KEY_ALIAS }}
          KP: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for v in KS SP KA KP; do
            if [ -z "${!v}" ]; then echo "Missing signing secret ($v); refusing to publish a debug-signed release."; exit 1; fi
          done

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :${MODULE}:testDebugUnitTest --stacktrace

      - name: Write signing config
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SP: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KA: ${{ secrets.SIGNING_KEY_ALIAS }}
          KP: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/spindle-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/spindle-release.jks"
            echo "storePassword=$SP"
            echo "keyAlias=$KA"
            echo "keyPassword=$KP"
          } > keystore.properties

      - name: Build signed release
        run: |
          if [ "$MODULE" = "app-main" ]; then
            ./gradlew :app-main:assembleRelease :app-main:bundleRelease
          else
            ./gradlew :app-lite:assembleRelease
          fi

      - name: Stage and verify artifacts
        run: |
          mkdir -p dist
          APK="$MODULE/build/outputs/apk/release/$MODULE-release.apk"
          cp "$APK" "dist/Spindle-$EDITION-v$VERSION-release.apk"
          if [ "$MODULE" = "app-main" ]; then
            cp "app-main/build/outputs/bundle/release/app-main-release.aab" "dist/Spindle-$EDITION-v$VERSION-release.aab"
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "dist/Spindle-$EDITION-v$VERSION-release.apk" | tee certs.txt
          if grep -qi "Android Debug" certs.txt; then echo "APK is signed with the debug key"; exit 1; fi
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="RELEASE_NOTES_${TAG}.md"
          if [ -f "$NOTES" ]; then NOTES_ARG=(--notes-file "$NOTES"); else NOTES_ARG=(--generate-notes); fi
          gh release create "$TAG" dist/* --title "Spindle $EDITION $TAG" "${NOTES_ARG[@]}"

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/spindle-release.jks"
