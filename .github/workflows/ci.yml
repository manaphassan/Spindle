name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (app-main, app-lite, core)
        run: ./gradlew :app-main:testDebugUnitTest :app-lite:testDebugUnitTest :core:test --stacktrace
      - name: Lint (app-main, against baseline)
        run: ./gradlew :app-main:lintDebug
      - name: Compile debug builds (app-main, app-lite)
        run: ./gradlew :app-main:assembleDebug :app-lite:assembleDebug
      - name: Reject private keys and keystores
        run: |
          if git ls-files | grep -Eiq '\.(jks|keystore|pem|p12)$|studio_signing_private|keystore\.properties$'; then
            echo "Secret key material is tracked"; exit 1; fi
      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            app-main/build/reports/lint-results-debug.*
          retention-days: 7
