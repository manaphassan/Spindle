name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (app-main, app-lite, core)
        run: ./gradlew :app-main:testDebugUnitTest :app-lite:testDebugUnitTest :core:test --stacktrace
      - name: Android lint (app-main)
        run: ./gradlew :app-main:lintDebug
      - name: Reject private keys and keystores
        run: |
          if git ls-files | grep -Eiq '\.(jks|keystore|pem|p12)$|studio_signing_private'; then
            echo "Secret key material is tracked"; exit 1; fi
