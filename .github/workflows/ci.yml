name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (app-main, app-lite, core)
        run: ./gradlew :app-main:testDebugUnitTest :app-lite:testDebugUnitTest :core:test --stacktrace
      - name: Lint (app-main, against baseline)
        run: ./gradlew :app-main:lintDebug
      - name: Compile debug builds (app-main, app-lite)
        run: ./gradlew :app-main:assembleDebug :app-lite:assembleDebug
      - name: Reject private keys and keystores
        run: |
          if git ls-files | grep -Eiq '\.(jks|keystore|pem|p12)$|studio_signing_private|keystore\.properties$'; then
            echo "Secret key material is tracked"; exit 1; fi
      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests/
            app-main/build/reports/lint-results-debug.*
          retention-days: 7

  # Boots the real app on an emulator. Unit tests can't catch startup wiring bugs, such as the
  # AudioEngine / AudioMetricsTracker recursion that once crashed every launch.
  startup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Startup smoke test (API 34 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew :app-main:connectedDebugAndroidTest --stacktrace
      - name: Upload instrumented test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: androidTest-reports
          path: app-main/build/reports/androidTests/
          retention-days: 7
